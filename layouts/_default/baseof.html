<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ if not .IsHome }}{{ .Title }} | {{ end }}{{ .Site.Title }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400;1,8..60,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  {{ block "main" . }}{{ end }}

  <footer class="site-footer">
    <nav class="footer-nav">
      <div class="footer-wordmark">
        {{ if (fileExists "static/images/CP_wordmark.png") }}
          <a href="/"><img src="/images/CP_wordmark.png" alt="Chris Pugh" class="footer-logo"></a>
        {{ else }}
          <a href="/" class="footer-logo-text">CP</a>
        {{ end }}
      </div>
      <div class="footer-links">
        <a href="/">About</a>
        <a href="/writing/">Writing</a>
        <span class="footer-link-disabled">Photography</span>
      </div>
    </nav>
  </footer>
</body>
</html>
